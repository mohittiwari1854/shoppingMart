<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Mart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f6fa;
    color: #222;
}

/* Navbar */
header {
    background: #2874f0;
    color: white;
    padding: 15px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.search-box {
    flex: 1;
    max-width: 500px;
}

.search-box input {
    width: 100%;
    padding: 11px 15px;
    border: none;
    outline: none;
    border-radius: 5px;
    font-size: 15px;
}

.cart-btn {
    background: white;
    color: #2874f0;
    border: none;
    padding: 10px 18px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

/* Hero */
.hero {
    text-align: center;
    padding: 45px 20px;
    background: linear-gradient(135deg, #2874f0, #6c5ce7);
    color: white;
}

.hero h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.hero p {
    font-size: 18px;
}

/* Categories */
.categories {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 25px;
    flex-wrap: wrap;
}

.category-btn {
    border: none;
    background: white;
    padding: 10px 18px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.category-btn.active,
.category-btn:hover {
    background: #2874f0;
    color: white;
}

/* Products */
.container {
    width: 90%;
    max-width: 1200px;
    margin: auto;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 25px;
    padding: 20px 0 50px;
}

.product {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,.1);
    transition: .3s;
}

.product:hover {
    transform: translateY(-5px);
}

.product img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.product-info {
    padding: 15px;
}

.product-info h3 {
    margin-bottom: 8px;
}

.category {
    color: #777;
    font-size: 13px;
}

.price {
    color: #2874f0;
    font-size: 20px;
    font-weight: bold;
    margin: 10px 0;
}

.add-btn {
    width: 100%;
    padding: 10px;
    border: none;
    background: #ff9f00;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

.add-btn:hover {
    background: #fb8c00;
}

/* Cart */
.cart {
    position: fixed;
    top: 0;
    right: -400px;
    width: 380px;
    max-width: 100%;
    height: 100%;
    background: white;
    z-index: 200;
    padding: 20px;
    box-shadow: -3px 0 15px rgba(0,0,0,.2);
    transition: .3s;
    overflow-y: auto;
}

.cart.open {
    right: 0;
}

.cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.close-cart {
    border: none;
    background: #eee;
    padding: 8px 12px;
    cursor: pointer;
}

.cart-item {
    display: flex;
    gap: 10px;
    border-bottom: 1px solid #ddd;
    padding: 15px 0;
}

.cart-item img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 5px;
}

.cart-details {
    flex: 1;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
}

.quantity button {
    border: none;
    background: #2874f0;
    color: white;
    width: 25px;
    height: 25px;
    cursor: pointer;
    border-radius: 3px;
}

.remove {
    color: red;
    cursor: pointer;
    font-size: 13px;
}

.cart-total {
    border-top: 2px solid #ddd;
    margin-top: 20px;
    padding-top: 15px;
    font-size: 20px;
    font-weight: bold;
}

.checkout {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    border: none;
    background: #2874f0;
    color: white;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

/* Footer */
footer {
    background: #172337;
    color: white;
    text-align: center;
    padding: 25px;
}

/* Mobile */
@media(max-width:600px) {
    header {
        flex-wrap: wrap;
    }

    .search-box {
        order: 3;
        flex-basis: 100%;
    }

    .hero h1 {
        font-size: 30px;
    }

    .cart {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🛍️ Shopping Mart</div>

    <div class="search-box">
        <input type="text" id="searchInput"
        placeholder="Search products...">
    </div>

    <button class="cart-btn" onclick="openCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>
</header>

<section class="hero">
    <h1>Welcome to Shopping Mart</h1>
    <p>Find everything you need at the best prices!</p>
</section>

<div class="categories">
    <button class="category-btn active" onclick="filterCategory('All', this)">
        All
    </button>

    <button class="category-btn" onclick="filterCategory('Electronics', this)">
        Electronics
    </button>

    <button class="category-btn" onclick="filterCategory('Fashion', this)">
        Fashion
    </button>

    <button class="category-btn" onclick="filterCategory('Grocery', this)">
        Grocery
    </button>
</div>

<main class="container">
    <div class="products" id="productList"></div>
</main>

<!-- Cart -->
<div class="cart" id="cart">

    <div class="cart-header">
        <h2>🛒 Your Cart</h2>
        <button class="close-cart" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
        Total: ₹<span id="cartTotal">0</span>
    </div>

    <button class="checkout" onclick="checkout()">
        Proceed to Checkout
    </button>
</div>

<footer>
    <p>© 2026 Shopping Mart | All Rights Reserved</p>
</footer>

<script>

const products = [
    {
        id: 1,
        name: "Wireless Headphones",
        category: "Electronics",
        price: 1499,
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
    },
    {
        id: 2,
        name: "Smart Watch",
        category: "Electronics",
        price: 2499,
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30"
    },
    {
        id: 3,
        name: "Men's T-Shirt",
        category: "Fashion",
        price: 599,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"
    },
    {
        id: 4,
        name: "Running Shoes",
        category: "Fashion",
        price: 1799,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff"
    },
    {
        id: 5,
        name: "Fresh Apples",
        category: "Grocery",
        price: 180,
        image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6"
    },
    {
        id: 6,
        name: "Organic Vegetables",
        category: "Grocery",
        price: 250,
        image: "https://images.unsplash.com/photo-1540420773420-3366772f4999"
    },
    {
        id: 7,
        name: "Bluetooth Speaker",
        category: "Electronics",
        price: 999,
        image: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1"
    },
    {
        id: 8,
        name: "Denim Jacket",
        category: "Fashion",
        price: 1999,
        image: "https://images.unsplash.com/photo-1551028719-00167b16eac5"
    }
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let currentCategory = "All";

/* Display Products */
function displayProducts() {

    const productList = document.getElementById("productList");
    const search = document.getElementById("searchInput").value.toLowerCase();

    productList.innerHTML = "";

    const filtered = products.filter(product => {

        const categoryMatch =
            currentCategory === "All" ||
            product.category === currentCategory;

        const searchMatch =
            product.name.toLowerCase().includes(search);

        return categoryMatch && searchMatch;
    });

    if(filtered.length === 0) {
        productList.innerHTML =
        "<h2>No products found.</h2>";
        return;
    }

    filtered.forEach(product => {

        productList.innerHTML += `
            <div class="product">

                <img src="${product.image}"
                     alt="${product.name}">

                <div class="product-info">

                    <h3>${product.name}</h3>

                    <p class="category">
                        ${product.category}
                    </p>

                    <p class="price">
                        ₹${product.price}
                    </p>

                    <button class="add-btn"
                        onclick="addToCart(${product.id})">
                        Add to Cart
                    </button>

                </div>
            </div>
        `;
    });
}

/* Category Filter */
function filterCategory(category, button) {

    currentCategory = category;

    document.querySelectorAll(".category-btn")
        .forEach(btn => btn.classList.remove("active"));

    button.classList.add("active");

    displayProducts();
}

/* Search */
document.getElementById("searchInput")
    .addEventListener("input", displayProducts);


/* Add To Cart */
function addToCart(id) {

    const existing = cart.find(item => item.id === id);

    if(existing) {
        existing.quantity++;
    } else {

        const product = products.find(item => item.id === id);

        cart.push({
            ...product,
            quantity: 1
        });
    }

    saveCart();

    alert("Product added to cart!");
}


/* Save Cart */
function saveCart() {

    localStorage.setItem("cart", JSON.stringify(cart));

    updateCart();
}


/* Update Cart */
function updateCart() {

    const cartItems = document.getElementById("cartItems");

    cartItems.innerHTML = "";

    let total = 0;
    let count = 0;

    cart.forEach(item => {

        total += item.price * item.quantity;
        count += item.quantity;

        cartItems.innerHTML += `

            <div class="cart-item">

                <img src="${item.image}">

                <div class="cart-details">

                    <strong>${item.name}</strong>

                    <p>₹${item.price}</p>

                    <div class="quantity">

                        <button onclick="changeQuantity(
                            ${item.id}, -1)">
                            -
                        </button>

                        <span>${item.quantity}</span>

                        <button onclick="changeQuantity(
                            ${item.id}, 1)">
                            +
                        </button>

                    </div>

                    <span class="remove"
                        onclick="removeItem(${item.id})">
                        Remove
                    </span>

                </div>

            </div>
        `;
    });

    document.getElementById("cartTotal").innerText =
        total.toLocaleString();

    document.getElementById("cartCount").innerText =
        count;
}


/* Change Quantity */
function changeQuantity(id, change) {

    const item = cart.find(item => item.id === id);

    item.quantity += change;

    if(item.quantity <= 0) {
        cart = cart.filter(item => item.id !== id);
    }

    saveCart();
}


/* Remove Item */
function removeItem(id) {

    cart = cart.filter(item => item.id !== id);

    saveCart();
}


/* Open Cart */
function openCart() {

    document.getElementById("cart")
        .classList.add("open");

    updateCart();
}


/* Close Cart */
function closeCart() {

    document.getElementById("cart")
        .classList.remove("open");
}


/* Checkout */
function checkout() {

    if(cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }

    alert("🎉 Order placed successfully!");

    cart = [];

    saveCart();

    closeCart();
}


/* Initial Load */
displayProducts();
updateCart();

</script>

</body>
</html>
